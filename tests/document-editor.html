<!doctype html><meta charset="utf-8"><title>Document editor regression tests</title>
<link rel="stylesheet" href="../document-editor.css"><style>body{font:16px system-ui;margin:24px;--ink:#222;--surface:white;--surface-2:#eee;--accent:#6558e8;--line:#ddd;--muted:#777}.pass{color:green}.fail{color:#b00}.document-image-controls{opacity:1;pointer-events:auto}</style>
<h1>One-page document regression tests</h1><button id="run">Run tests</button><ol id="results"></ol><div id="host"></div>
<script src="../editor-ux.js"></script><script src="../document-editor.js"></script><script>
const host=document.querySelector('#host'),results=document.querySelector('#results');
const initial=[{id:1,_kind:'textbox',text:'Before',x:0,y:0,w:820,h:40},{id:2,_kind:'image',x:0,y:100,w:300,h:150},{id:3,_kind:'textbox',text:'After',x:0,y:300,w:820,h:40},{id:4,_kind:'image',x:0,y:400,w:300,h:150}];
const svg='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150"><rect width="300" height="150" fill="lightblue"/></svg>');
function check(value,message='Assertion failed'){if(!value)throw Error(message);}
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;let writes=[],fail=false,counter=10,server=structuredClone(initial);host.replaceChildren();results.replaceChildren();
 const editor=TaskflowDocument.create({host,readText:node=>({text:node.textContent,fontRuns:[]}),writeText:(node,text)=>node.textContent=text,status:()=>{},media:()=>({src:svg}),openCanvas:()=>{},save:async(id,changes)=>{if(fail)throw Error('offline');writes.push(structuredClone(changes));return changes.map(item=>{const copy={...item,id:item.id<0?counter++:item.id};server=server.filter(entry=>entry.id!==copy.id);server.push(copy);return {previousId:item.id,item:copy};});}});
 async function test(name,run){const li=document.createElement('li');try{await run();li.className='pass';li.textContent='PASS — '+name;}catch(e){li.className='fail';li.textContent='FAIL — '+name+': '+e.message;}results.append(li);}
 await test('Opening a document performs no writes',async()=>{editor.sync('test',initial);await editor.flush();check(writes.length===0);check(host.querySelectorAll('.document-block').length===4);});
 await test('Typing before an image naturally moves it down',()=>{const text=host.querySelector('.document-text'),image=host.querySelector('.document-figure');const before=image.getBoundingClientRect().top;text.textContent='Before\nNew line\nAnother line';text.dispatchEvent(new InputEvent('input',{bubbles:true}));check(image.getBoundingClientRect().top>before);});
 await test('Saving only writes changed text, not other original objects',async()=>{await editor.flush();check(writes.length===1&&writes[0].length===1&&writes[0][0].id===1);});
 await test('Before and after controls reuse adjacent paragraphs',()=>{const controls=host.querySelectorAll('.document-image-block .document-insert');controls[0].click();check(document.activeElement===host.querySelectorAll('.document-text')[0]);controls[1].click();check(document.activeElement===host.querySelectorAll('.document-text')[1]);check(host.querySelectorAll('.document-block').length===4);});
 await test('A paragraph after the final image is saved once with a real ID',async()=>{host.querySelectorAll('.document-image-block .document-insert')[3].click();const text=document.activeElement;text.textContent='New final paragraph';text.dispatchEvent(new InputEvent('input',{bubbles:true}));await editor.flush();check(writes.at(-1).length===1);check(+text.closest('[data-document-id]').dataset.documentId===10);await editor.flush();check(writes.length===2);});
 await test('All three image alignments save and reflect their selected state',async()=>{for(const alignment of ['right','center','left']){const button=host.querySelector('[data-align='+alignment+']');button.click();await editor.flush();check(button.getAttribute('aria-pressed')==='true');check(writes.at(-1)[0].documentAlign===alignment);}});
 await test('A failed save retains text and offers retry',async()=>{const text=host.querySelector('.document-text');text.textContent='Keep this draft';text.dispatchEvent(new InputEvent('input',{bubbles:true}));fail=true;check(!await editor.flush());check(editor.hasPending());check(!host.querySelector('.document-retry').hidden);check(text.textContent==='Keep this draft');fail=false;check(await editor.flush());check(!editor.hasPending());});
 await test('Server echoes do not replace the active paragraph or selection',()=>{const text=host.querySelector('.document-text');text.focus();const range=document.createRange();range.selectNodeContents(text);range.collapse(false);getSelection().removeAllRanges();getSelection().addRange(range);const anchor=getSelection().anchorNode;editor.sync('test',server);check(document.activeElement===text);check(getSelection().anchorNode===anchor);});
 await test('A re-open restores saved paragraph order and alignment',()=>{editor.sync('other',[]);editor.sync('test',server);const blocks=[...host.querySelectorAll('[data-document-id]')];check(blocks.at(-1).dataset.documentId==='10');check(blocks.at(-1).textContent==='New final paragraph');check(host.querySelector('[data-align=left]').getAttribute('aria-pressed')==='true');});
 await test('Ordering places inserted paragraphs between their neighbors',()=>{const sorted=TaskflowDocument.ordered(initial);const order=TaskflowDocument.adjacentOrder(sorted[0],sorted[1]);const result=TaskflowDocument.ordered([...initial,{id:99,_kind:'textbox',documentOrder:order}]);check(result[1].id===99);});
 document.querySelector('#run').disabled=false;
};
</script>
